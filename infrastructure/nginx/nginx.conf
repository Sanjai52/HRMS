worker_processes 1;
events { worker_connections 256; }

http {
  resolver 127.0.0.11 valid=10s;
  upstream api {
    # Round-robin is the default algorithm (benchmark baseline); add `least_conn;`
    # here to compare the alternative. Each host port is one API replica process.
    server host.docker.internal:4000 max_fails=2 fail_timeout=10s;
    server host.docker.internal:4002 max_fails=2 fail_timeout=10s;
    server host.docker.internal:4003 max_fails=2 fail_timeout=10s;
  }

  server {
    listen 80;
    location = /metrics {
      # Prometheus scrapes each API replica directly; never expose /metrics publicly.
      return 403;
    }
    location / {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
    }
    location /health {
      proxy_pass http://api/health;
    }
  }
}
