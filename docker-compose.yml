services:
  pg-catalog:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms
      POSTGRES_DB: hrms_catalog
    ports:
      - "5438:5432"
    volumes:
      - pg-catalog-data:/var/lib/postgresql/data

  shard-1:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms
      POSTGRES_DB: hrms_shard1
    ports:
      - "5439:5432"
    volumes:
      - shard-1-data:/var/lib/postgresql/data

  shard-2:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms
      POSTGRES_DB: hrms_shard2
    ports:
      - "5440:5432"
    volumes:
      - shard-2-data:/var/lib/postgresql/data

  shard-3:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms
      POSTGRES_DB: hrms_shard3
    ports:
      - "5441:5432"
    volumes:
      - shard-3-data:/var/lib/postgresql/data

  shard-4:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms
      POSTGRES_DB: hrms_shard4
    ports:
      - "5442:5432"
    volumes:
      - shard-4-data:/var/lib/postgresql/data

volumes:
  pg-catalog-data:
  shard-1-data:
  shard-2-data:
  shard-3-data:
  shard-4-data:
