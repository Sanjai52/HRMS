services:
  pg-catalog:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms
      POSTGRES_DB: hrms_catalog
    ports:
      - "5438:5432"
    volumes:
      - pg-catalog-data:/var/lib/postgresql/data

  shard-1:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms
      POSTGRES_DB: hrms_shard1
    ports:
      - "5439:5432"
    volumes:
      - shard-1-data:/var/lib/postgresql/data

  shard-2:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms
      POSTGRES_DB: hrms_shard2
    ports:
      - "5440:5432"
    volumes:
      - shard-2-data:/var/lib/postgresql/data

  shard-3:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms
      POSTGRES_DB: hrms_shard3
    ports:
      - "5441:5432"
    volumes:
      - shard-3-data:/var/lib/postgresql/data

  shard-4:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms
      POSTGRES_DB: hrms_shard4
    ports:
      - "5442:5432"
    volumes:
      - shard-4-data:/var/lib/postgresql/data

  redis-queue:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-queue-data:/data

  redis-kv:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6380:6379"
    volumes:
      - redis-kv-data:/data

  s3:
    image: motoserver/moto:latest
    command: ["-H", "0.0.0.0", "-p", "5000"]
    environment:
      MOTO_S3_DEFAULT_KEY_BUFFER_SIZE: "524288"
    ports:
      - "5000:5000"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - redis-queue

  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana-provisioning:/etc/grafana/provisioning:ro

volumes:
  pg-catalog-data:
  shard-1-data:
  shard-2-data:
  shard-3-data:
  shard-4-data:
  redis-queue-data:
  redis-kv-data:
  prometheus-data:
  grafana-data:
