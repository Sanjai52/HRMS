services:
  pg-catalog:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms
      POSTGRES_DB: hrms_catalog
    ports:
      - "5438:5432"
    volumes:
      - pg-catalog-data:/var/lib/postgresql/data

  shard-1:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms
      POSTGRES_DB: hrms_shard1
    ports:
      - "5439:5432"
    volumes:
      - shard-1-data:/var/lib/postgresql/data

  shard-2:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms
      POSTGRES_DB: hrms_shard2
    ports:
      - "5440:5432"
    volumes:
      - shard-2-data:/var/lib/postgresql/data

  shard-3:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms
      POSTGRES_DB: hrms_shard3
    ports:
      - "5441:5432"
    volumes:
      - shard-3-data:/var/lib/postgresql/data

  shard-4:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms
      POSTGRES_DB: hrms_shard4
    ports:
      - "5442:5432"
    volumes:
      - shard-4-data:/var/lib/postgresql/data

  redis-queue:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-queue-data:/data

  redis-kv:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6380:6379"
    volumes:
      - redis-kv-data:/data

  s3:
    image: motoserver/moto:latest
    command: ["-H", "0.0.0.0", "-p", "5000"]
    environment:
      MOTO_S3_DEFAULT_KEY_BUFFER_SIZE: "524288"
    ports:
      - "5000:5000"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  candidate-portal:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm install --no-save --no-audit --no-fund express@4 >/dev/null 2>&1; node src/index.mjs"]
    environment:
      PORTAL_PORT: "4100"
    ports:
      - "4100:4100"
    volumes:
      - ./apps/candidate-portal:/app

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - redis-queue

  cadvisor:
    image: google/cadvisor:latest
    profiles: ["observability"]
    command: ["-http", ":8080"]
    ports:
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:root:ro

  postgres-exporter-catalog:
    image: postgres-exporter
    profiles: ["observability"]
    command:
      - -web.listen-address=":9100"
      - -pg.sslmode=disable
      - -pg.user=hrms
      - -pg.password=hrms
      - -pg.database=hrms_catalog
      - -collectors.discovery=false
    ports:
      - "9101:9100"

  postgres-exporter-shard-1:
    image: postgres-exporter
    profiles: ["observability"]
    command:
      - -web.listen-address=":9100"
      - -pg.sslmode=disable
      - -pg.user=hrms
      - -pg.password=hrms
      - -pg.database=hrms_shard1
      - -collectors.discovery=false
    ports:
      - "9102:9100"

  postgres-exporter-shard-2:
    image: postgres-exporter
    profiles: ["observability"]
    command:
      - -web.listen-address=":9100"
      - -pg.sslmode=disable
      - -pg.user=hrms
      - -pg.password=hrms
      - -pg.database=hrms_shard2
      - -collectors.discovery=false
    ports:
      - "9103:9100"

  postgres-exporter-shard-3:
    image: postgres-exporter
    profiles: ["observability"]
    command:
      - -web.listen-address=":9100"
      - -pg.sslmode=disable
      - -pg.user=hrms
      - -pg.password=hrms
      - -pg.database=hrms_shard3
      - -collectors.discovery=false
    ports:
      - "9104:9100"

  postgres-exporter-shard-4:
    image: postgres-exporter
    profiles: ["observability"]
    command:
      - -web.listen-address=":9100"
      - -pg.sslmode=disable
      - -pg.user=hrms
      - -pg.password=hrms
      - -pg.database=hrms_shard4
      - -collectors.discovery=false
    ports:
      - "9105:9100"

  redis-exporter-queue:
    image: oliver006/redis-exporter
    profiles: ["observability"]
    command:
      - -redis.addr="redis-queue:6379"
    ports:
      - "9121:9121"

  redis-exporter-kv:
    image: oliver006/redis-exporter
    profiles: ["observability"]
    command:
      - -redis.addr="redis-kv:6380"
    ports:
      - "9122:9121"

  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana-provisioning:/etc/grafana/provisioning:ro

volumes:
  pg-catalog-data:
  shard-1-data:
  shard-2-data:
  shard-3-data:
  shard-4-data:
  redis-queue-data:
  redis-kv-data:
  prometheus-data:
  grafana-data: